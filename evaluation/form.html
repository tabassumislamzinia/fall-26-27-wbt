<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form method="post">
        <table>
            <h2> Donor Information </h2>
            <tr>
                <td><label for="fname"> First Name* </label></td>
                <td><input type="text" id="fname" name="fname" required> </td>
            </tr>
            <tr>
                <td><label for="last name"> Last Name* </label></td>
                <td><input type="text" id="lname" name="lname" required> </td>
            </tr>
            <tr>
                <td><label for="company"> Company </label></td>
                <td><input type="text" id="company" name="company"> </td>
            </tr>
            <tr>
                <td><label for="address1"> Address 1* </label></td>
                <td><input type="text" id="address1" name="address1" required> </td>
            </tr>
            <tr>
                <td><label for="address2"> Address 2 </label></td>
                <td><input type="text" id="address2" name="address2"> </td>
            </tr>
            <tr>
                <td><label for="state"> State* </label></td>
                <td>
                    <select id="state" name="state">
                        <option> Select a state</option>
                        <option> California </option>
                        <option> Dhaka </option>
                        <option> Gujarat </option>
                    </select>
                </td>
            </tr>
            <tr>
                <td><label for="zipcode"> Zip Code* </label></td>
                <td><input type="number" id="zipcode" name="zipcode" required> </td>
            </tr>
            <tr>
                <td><label for="state"> State* </label></td>
                <td>
                    <select id="state" name="state" required>
                        <option> Select a State</option>
                        <option> California </option>
                        <option> Dhaka </option>
                        <option> Gujarat </option>
                    </select>
                </td>
            </tr>
            <tr>
                <td><label for="country"> Country* </label></td>
                <td>
                    <select id="country" name="country" required>
                        <option> Select a Country </option>
                        <option> Bangladesh </option>
                        <option> India </option>
                        <option> USA </option>
                    </select>
                </td>
            </tr>
            <tr>
                <td><label for="phone"> Phone </label></td>
                <td><input type="tel" id="phone" name="phone"> </td>
            </tr>
            <tr>
                <td><label for="fax"> Fax </label></td>
                <td><input type="tel" id="fax" name="fax"> </td>
            </tr>
            <tr>
                <td><label for="email"> Email* </label></td>
                <td><input type="email" id="email" name="email" required> </td>
            </tr>
            <tr>
                <td><label> Donation Amount* <br> (Check a button or type in your amount)</label> </label></td>
                <td>
                    <input type="radio" name="amount" value="none">None
                    <input type="radio" name="amount" value="50">$50
                    <input type="radio" name="amount" value="75">$75
                    <input type="radio" name="amount" value="100">$100
                    <input type="radio" name="amount" value="250">$250
                    <input type="radio" name="amount" value="other">Other
                </td>
            </tr>
            <tr>
                <td><label for="other"> Other amount $ </label></td>
                <td><input type="number" id="other" name="other"> </td>
            </tr>
            <tr>
                <td>
                    <label> Recurring Donation <br> (Check if yes) </label>
                </td>
                <td>
                    <input type="checkbox" value="interested"> I am interested in giving on a regular basis
                </td>
            </tr>

            <tr>
                <td></td>
                <td>
                    <label for="credit"> Monthly Credit Card $ </label>
                    <input type="number" id="credit" name="credit">
                    <label for="month"> For </label>
                    <input type="number" id="month" name="month">
                    <label> Month </label>
                </td>
            </tr>
        </table>
        <table>
            <h2> Honorarium and Memorial Donation Information </h2>

            <tr>
                <td>
                    <label> I would like to make this <br> donation </label>
                </td>
                <td>
                    <input type="radio" name="honor" value="honor"> To Honor
                    <input type="radio" name="honor" value="memory"> In Memory of
                </td>
            </tr>

            <tr>
                <td>
                    <label for="name"> Name </label>
                </td>
                <td>
                    <input type="text" id="name" name="name">
                </td>
            </tr>

            <tr>
                <td>
                    <label for="donto"> Acknowledge Donation To </label>
                </td>
                <td>
                    <input type="text" id="donto" name="donto">
                </td>
            </tr>

            <tr>
                <td>
                    <label for="address"> Address </label>
                </td>
                <td>
                    <input type="text" id="address" name="address">
                </td>
            </tr>

            <tr>
                <td>

                </td>

                <td>

                </td>

                        <option> Gujrat </option>
                        <option> Texas </option>
                    </select>
                </td>
            </tr>

            <tr>
                <td>
                    <label for="zip"> Zip </label>
                </td>
                <td>
                    <input type="number" id="zip" name="zip">
                </td>
            <tr>
                <td></td>
                <td>
                    <input type="submit" value="Continue">
                    <input type="Reset">
                </td>
            </tr>
            </tr>
        </table>
    </form>
</body>

</html>
